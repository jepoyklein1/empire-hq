name: Pull Sleeper data

# Runs at 06:00 UTC on Sun, Tue and Thu: 1:00 AM Central in daylight time
# (midnight in standard time), about an hour before each 2:00 AM edition.
on:
  schedule:
    - cron: "0 6 * * 0,2,4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download league data
        env:
          LEAGUE: "1324744734186422272"
        run: |
          set -euo pipefail
          API=https://api.sleeper.app/v1
          mkdir -p data/matchups data/transactions data/projections
          curl -fsS "$API/state/nfl"                   -o data/state.json
          curl -fsS "$API/league/$LEAGUE"              -o data/league.json
          curl -fsS "$API/league/$LEAGUE/users"        -o data/users.json
          curl -fsS "$API/league/$LEAGUE/rosters"      -o data/rosters.json
          curl -fsS "$API/league/$LEAGUE/traded_picks" -o data/traded_picks.json
          curl -fsS "$API/players/nfl"                 -o data/players.json
          SEASON=$(python3 -c "import json;print(json.load(open('data/state.json'))['season'])")
          WEEK=$(python3 -c "import json;s=json.load(open('data/state.json'));print(max(1,int(s.get('week') or 1)))")
          LAST=$(( WEEK < 18 ? WEEK + 1 : 18 ))
          for w in $(seq 1 "$LAST"); do
            curl -fsS "$API/league/$LEAGUE/matchups/$w"     -o "data/matchups/$w.json"     || true
            curl -fsS "$API/league/$LEAGUE/transactions/$w" -o "data/transactions/$w.json" || true
          done
          for w in "$WEEK" "$LAST"; do
            for pos in QB RB WR TE; do
              curl -fsS "https://api.sleeper.app/projections/nfl/$SEASON/$w?season_type=regular&position%5B%5D=$pos" -o "data/projections/${w}_$pos.json" || true
            done
          done
          curl -fsS "https://api.fantasycalc.com/values/current?isDynasty=true&numQbs=2&numTeams=12&ppr=1" -o data/fc_values.json || true
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/updated_at.txt
      - name: Save to the repository
        run: |
          git config user.name "empire-hq-bot"
          git config user.email "empire-hq-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Sleeper data refresh"
          git push
